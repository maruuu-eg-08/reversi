[package]
name = "reversi_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"  # u64::is_multiple_of
description = "Rust implementation of the Lv.5 reversi search engine, callable from Python"
publish = false

[lib]
name = "reversi_engine"
# cdylib: Python extension module / rlib: cargo test and benchmarks
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Python bindings (PyO3). Optional so that cargo test does not need them
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310"], optional = true }
rustc-hash = "2"

[profile.release]
lto = true
codegen-units = 1
