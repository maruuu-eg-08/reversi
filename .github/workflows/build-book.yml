# 序盤の定石（backend/opening_book.txt）を GitHub のサーバーで生成する。
#
# 数時間かかる計算なので手動で実行する:
#   Actions タブ → Build opening book → Run workflow
#   または gh workflow run build-book.yml --ref <ブランチ> -f depth=10 ...
#
# 1回のジョブは6時間までなので、--minutes で計算を打ち切り、途中結果をキャッシュに保存する。
# 同じ設定でもう一度実行すると、保存した途中結果から続きを計算する。
# 完成した定石ファイルは、実行結果ページの Artifacts からダウンロードできる。
name: Build opening book

on:
  workflow_dispatch:
    inputs:
      depth:
        description: 最善手を決める読みの深さ
        default: "10"
      full_plies:
        description: すべての局面を登録する手数
        default: "6"
      plies:
        description: 定石を作る手数
        default: "8"
      replies:
        description: full_plies より先で考える相手の手の数
        default: "3"
      rank_depth:
        description: 相手の手を選ぶときの読みの深さ
        default: "4"
      engine:
        description: 探索の実装（rust は python より約80倍速い。結果は同じ）
        type: choice
        options: [rust, python]
        default: rust
      minutes:
        description: 計算に使う最大の分数（ジョブ上限の6時間より短くする）
        default: "330"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # 入力値はシェルに直接埋め込まず、環境変数で渡す
      DEPTH: ${{ inputs.depth }}
      FULL_PLIES: ${{ inputs.full_plies }}
      PLIES: ${{ inputs.plies }}
      REPLIES: ${{ inputs.replies }}
      RANK_DEPTH: ${{ inputs.rank_depth }}
      MINUTES: ${{ inputs.minutes }}
      # 途中結果は設定ごとに分ける（Rust 版と Python 版は計算結果が同じなので共有する）
      CACHE_KEY: book-d${{ inputs.depth }}-f${{ inputs.full_plies }}-p${{ inputs.plies }}-r${{ inputs.replies }}-k${{ inputs.rank_depth }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust 版エンジンをビルド
        if: inputs.engine == 'rust'
        run: pip install ./backend_rust && python -c "import reversi_engine"

      - name: 途中結果を復元
        uses: actions/cache/restore@v4
        with:
          path: backend/opening_book.txt.cache
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_KEY }}-

      - name: 定石を生成
        id: build
        working-directory: backend
        run: |
          before=$( [ -f opening_book.txt.cache ] && wc -l < opening_book.txt.cache || echo 0 )
          echo "前回までに読んだ局面: $before"
          set +e
          timeout "${MINUTES}m" python -u build_book.py \
            --depth "$DEPTH" --full-plies "$FULL_PLIES" --plies "$PLIES" \
            --replies "$REPLIES" --rank-depth "$RANK_DEPTH" -j "$(nproc)"
          status=$?
          set -e
          after=$( [ -f opening_book.txt.cache ] && wc -l < opening_book.txt.cache || echo 0 )
          if [ "$status" -eq 0 ]; then
            result="完成（$(grep -vc '^#' opening_book.txt) 局面）"
          elif [ "$status" -eq 124 ]; then
            result="時間切れで中断。もう一度同じ設定で実行すると続きから再開します"
          else
            echo "build_book.py が異常終了しました（終了コード $status）"
            exit "$status"
          fi
          {
            echo "## 定石の生成"
            echo "- 設定: depth=$DEPTH full_plies=$FULL_PLIES plies=$PLIES replies=$REPLIES rank_depth=$RANK_DEPTH"
            echo "- エンジン: $(python -c 'from strong_ai import StrongAI; print(StrongAI(1).engine)'), CPU $(nproc) コア"
            echo "- この実行で読んだ局面: $((after - before))（累計 $after）"
            echo "- 結果: $result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 途中結果を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/opening_book.txt.cache
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: 定石ファイルをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opening-book
          path: |
            backend/opening_book.txt
            backend/opening_book.txt.cache
          if-no-files-found: ignore
