# Build the opening book (backend/opening_book.txt) on GitHub's servers.
#
# Run manually, since it can take hours:
#   Actions tab -> Build opening book -> Run workflow
#   or: gh workflow run build-book.yml --ref <branch> -f depth=10 ...
#
# A job may run for at most 6 hours, so the computation stops after --minutes and saves its partial results to the cache.
# Running again with the same settings continues from the saved results.
# The finished book can be downloaded from the run's Artifacts.
name: Build opening book

on:
  workflow_dispatch:
    inputs:
      depth:
        description: search depth for book moves
        default: "10"
      full_plies:
        description: include every position up to this ply
        default: "6"
      plies:
        description: build the book up to this ply
        default: "8"
      replies:
        description: opponent replies to follow beyond full_plies
        default: "3"
      rank_depth:
        description: search depth for ranking opponent replies
        default: "4"
      engine:
        description: search implementation (rust is about 80x faster than python; same results)
        type: choice
        options: [rust, python]
        default: rust
      minutes:
        description: maximum minutes of computation (keep below the 6-hour job limit)
        default: "330"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # inputs are passed through environment variables, never interpolated into the shell
      DEPTH: ${{ inputs.depth }}
      FULL_PLIES: ${{ inputs.full_plies }}
      PLIES: ${{ inputs.plies }}
      REPLIES: ${{ inputs.replies }}
      RANK_DEPTH: ${{ inputs.rank_depth }}
      MINUTES: ${{ inputs.minutes }}
      # partial results are separate per setting (Rust and Python give identical results, so they share)
      CACHE_KEY: book-d${{ inputs.depth }}-f${{ inputs.full_plies }}-p${{ inputs.plies }}-r${{ inputs.replies }}-k${{ inputs.rank_depth }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Rust engine
        if: inputs.engine == 'rust'
        run: pip install ./backend_rust && python -c "import reversi_engine"

      - name: Restore partial results
        uses: actions/cache/restore@v4
        with:
          path: backend/opening_book.txt.cache
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_KEY }}-

      - name: Build the opening book
        id: build
        working-directory: backend
        run: |
          before=$( [ -f opening_book.txt.cache ] && wc -l < opening_book.txt.cache || echo 0 )
          echo "positions searched in earlier runs: $before"
          set +e
          timeout "${MINUTES}m" python -u build_book.py \
            --depth "$DEPTH" --full-plies "$FULL_PLIES" --plies "$PLIES" \
            --replies "$REPLIES" --rank-depth "$RANK_DEPTH" -j "$(nproc)"
          status=$?
          set -e
          after=$( [ -f opening_book.txt.cache ] && wc -l < opening_book.txt.cache || echo 0 )
          if [ "$status" -eq 0 ]; then
            result="finished ($(grep -vc '^#' opening_book.txt) positions)"
          elif [ "$status" -eq 124 ]; then
            result="stopped at the time limit; run again with the same settings to continue"
          else
            echo "build_book.py failed (exit code $status)"
            exit "$status"
          fi
          {
            echo "## Opening book build"
            echo "- settings: depth=$DEPTH full_plies=$FULL_PLIES plies=$PLIES replies=$REPLIES rank_depth=$RANK_DEPTH"
            echo "- engine: $(python -c 'from strong_ai import StrongAI; print(StrongAI(1).engine)'), $(nproc) CPU cores"
            echo "- positions searched in this run: $((after - before)) (total $after)"
            echo "- result: $result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save partial results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/opening_book.txt.cache
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Upload the opening book
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opening-book
          path: |
            backend/opening_book.txt
            backend/opening_book.txt.cache
          if-no-files-found: ignore
