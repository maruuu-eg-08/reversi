name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  # Tests without Rust (the pure-Python path)
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install numpy pytest
      - run: pytest -v

  # Rust engine: formatting, lints, Rust tests, and tests that it matches the Python engine
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup component add rustfmt clippy && rustup target add wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features python -- -D warnings
      - run: cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --release
      - run: pip install numpy pytest ./
      - run: python -c "import reversi_engine"
      - run: pytest -v
        working-directory: .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # the web version runs the Rust engine compiled to WebAssembly
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # run the built engine in Node: every AI level, analysis, opening names and full games
      - run: npm test
        working-directory: frontend
