[project]
name = "reversi-ai"
version = "0.1.0"
description = "Bitboard Reversi engine with alpha-beta search and GA-tuned evaluation"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
gui = ["pygame"]
bench = ["matplotlib"]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E741: P（手番側）/O（相手側）はリバーシエンジンで慣例の変数名なので許可する
ignore = ["E501", "E741"]
